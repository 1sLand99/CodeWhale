name: Debug receipt tests
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Run receipt tests with full output
        run: cargo test -p codewhale-tui --lib --all-features --locked -- --nocapture issue_5305_explicit_profile_matches_type_resolution_and_conflicts_refuse issue_5305_first_personal_profile_receipt_precedes_status_poll
        env:
          RUST_MIN_STACK: '16777216'
          RUST_BACKTRACE: '1'
